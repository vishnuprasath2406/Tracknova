<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>TrackNova — Chennai Traffic Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#f2f5f7;--pn:#fff;--ink:#12222c;--mut:#5b6b77;--ln:#dbe2e7;--ac:#0a6c74;--bt:#fff;--ok:#178a58;--wa:#c98500;--bd:#cc3a34;--sb:#0e2731;--w:#cfe3ea;--g:#e6f0e4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-family:'Manrope',system-ui,sans-serif}
:root[data-theme=dark]{--bg:#0b1418;--pn:#122027;--ink:#e5edf1;--mut:#8fa1ac;--ln:#22343d;--ac:#3cc4b8;--bt:#062a2d;--sb:#08181e;--w:#0f2a35;--g:#12261f}
html,body{height:100%;margin:0}body{background:var(--bg);color:var(--ink);font-size:.92rem}
*{box-sizing:border-box}button,input,select,textarea{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.app{display:grid;grid-template-columns:216px minmax(0,1fr);height:100%}
aside{background:var(--sb);color:#cfe0e6;padding:16px 12px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.brand{font-weight:800;font-size:1.15rem;color:#fff;padding:4px 8px 2px}.sub{font-size:.72rem;color:#8fb0ba;padding:0 8px 14px}
aside button{background:0;border:0;color:inherit;text-align:left;padding:10px 12px;border-radius:9px;cursor:pointer;font-weight:600;display:flex;gap:10px}
aside button.on{background:#1c4552;color:#fff}aside button:hover{background:#163743}
main{overflow:auto;padding:0 22px 26px}
header{position:sticky;top:0;background:var(--bg);display:flex;gap:12px;align-items:center;padding:14px 0;z-index:5}
header h1{font-size:1.3rem;margin:0;font-weight:800;letter-spacing:-.02em}
.pill{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--pn);border:1px solid var(--ln);color:var(--mut)}
header input{margin-left:auto;width:min(300px,34vw);padding:9px 12px;border:1px solid var(--ln);border-radius:9px;background:var(--pn)}
.ib{position:relative;background:var(--pn);border:1px solid var(--ln);border-radius:9px;width:38px;height:38px;cursor:pointer}
.ib b{position:absolute;top:-5px;right:-5px;background:var(--bd);color:#fff;border-radius:9px;font-size:.65rem;padding:1px 5px}
.av{background:var(--ac);color:var(--bt);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;font-weight:800;font-size:.8rem}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:16px}
h3{margin:0 0 10px;font-size:.95rem;font-weight:700}.mut{color:var(--mut);font-size:.8rem}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kp b{display:block;font-size:1.6rem;font-weight:800;letter-spacing:-.02em;margin-top:4px}.kp span{color:var(--mut);font-size:.78rem}
.g2{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:14px;margin-bottom:14px}.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.ga{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-bottom:14px}
@media(max-width:900px){.g2{grid-template-columns:1fr}.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}aside{flex-direction:row;overflow-x:auto;padding:8px}.brand,.sub{display:none}aside button{white-space:nowrap}main{padding:0 12px 20px}}
.mw{height:390px;border-radius:10px;overflow:hidden;position:relative;border:1px solid var(--ln)}.mw.big{height:min(64vh,560px);min-height:380px}canvas{width:100%;height:100%;display:block;touch-action:none}
.lg{display:flex;gap:14px;margin-top:10px;font-size:.75rem;color:var(--mut)}.lg i{display:inline-block;width:18px;height:5px;border-radius:3px;margin-right:5px;vertical-align:middle}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}
.bar{height:6px;border-radius:9px;background:var(--ln);overflow:hidden;margin-top:5px}.bar i{display:block;height:100%}
.ch{padding:2px 9px;border-radius:99px;font-size:.72rem;font-weight:700;white-space:nowrap;border:0}
.hi,.Critical,.Flagged{background:rgba(204,58,52,.14);color:var(--bd)}.me,.Medium,.Under{background:rgba(201,133,0,.16);color:var(--wa)}.lo,.Low,.Cleared{background:rgba(23,138,88,.14);color:var(--ok)}.High{background:rgba(204,58,52,.14);color:var(--bd)}.st{background:var(--bg);color:var(--mut)}
.btn{background:var(--ac);color:var(--bt);border:0;border-radius:9px;padding:9px 14px;font-weight:700;cursor:pointer}.btn.o{background:var(--pn);color:var(--ink);border:1px solid var(--ln)}
.ic{cursor:pointer}.ic:hover{border-color:var(--ac)}
select,input,textarea{padding:9px 10px;border:1px solid var(--ln);border-radius:9px;background:var(--pn);width:100%}
.tg{width:44px;height:24px;border-radius:99px;border:0;background:var(--ln);position:relative;cursor:pointer;flex:none}.tg::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}.tg.on{background:var(--ac)}.tg.on::after{left:23px}
.stage{position:relative;background:#0b1418;border-radius:10px;overflow:hidden;aspect-ratio:16/9;display:grid;place-items:center;color:#8fa1ac;text-align:center}.stage video{width:100%;height:100%;object-fit:contain;position:absolute;inset:0}.stage canvas{position:absolute;inset:0;pointer-events:none}
.md{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:20}.md>div{width:min(430px,92vw);display:grid;gap:10px}
.fab{position:fixed;right:18px;bottom:18px;width:52px;height:52px;border-radius:50%;border:0;background:var(--ac);color:var(--bt);font-weight:800;cursor:pointer;z-index:9;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#bot{position:fixed;right:18px;bottom:80px;width:min(330px,90vw);z-index:9;display:none}#bot.on{display:block}#msgs{height:230px;overflow:auto;font-size:.85rem;display:grid;gap:6px;align-content:start;margin-bottom:8px}#msgs p{margin:0;padding:7px 10px;border-radius:9px;background:var(--bg)}#msgs p.u{background:var(--ac);color:var(--bt);justify-self:end}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;z-index:30;display:none;font-weight:600}
.dz{cursor:pointer;padding:20px}

:root{--bg:#f3f6fb;--pn:#fff;--ink:#0d1b2e;--mut:#5c6c82;--ln:#e0e7f1;--ac:#1668e3;--bt:#fff;--sb:#fff;--w:#dbe9f7;--g:#eef3ea;font-family:'Manrope',system-ui,sans-serif}
:root[data-theme=dark]{--bg:#0a1220;--pn:#111c30;--ink:#e6edf7;--mut:#8b9bb3;--ln:#1f2d45;--ac:#4c9bff;--bt:#04122a;--sb:#0d1729;--w:#0e2038;--g:#0f1f2a}
h1,h3,.kp b{font-family:'Sora',sans-serif}
aside{background:var(--sb);color:var(--mut);border-right:1px solid var(--ln)}aside button:hover{background:var(--bg)}aside button.on{background:rgba(22,104,227,.1);color:var(--ac)}
.logo{background:#fff;border-radius:10px;padding:6px 10px;margin:2px 4px 14px;border:1px solid var(--ln)}.logo img{display:block;width:100%;height:auto}
.card{border-radius:14px;box-shadow:0 1px 2px rgba(13,27,46,.05)}header{border-bottom:1px solid var(--ln);margin-bottom:14px}
.btn{background:var(--ac)}.btn.o{background:var(--pn)}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);padding:4px;border-radius:10px;border:1px solid var(--ln)}.sg button{border:0;background:0;padding:8px 12px;border-radius:8px;font-weight:700;cursor:pointer;color:var(--mut)}.sg .on{background:var(--pn);color:var(--ac);box-shadow:0 1px 3px rgba(0,0,0,.12)}
#auth{position:fixed;inset:0;z-index:25;background:var(--bg);display:grid;place-items:center;padding:16px;overflow:auto}.au{width:min(400px,100%)}
@media(max-width:900px){.logo{display:none}}
.leaflet-container{background:var(--bg);font-family:'Manrope',system-ui,sans-serif}
.leaflet-popup-content{margin:10px 12px;font-size:.85rem}
.tnlbl{background:none!important;border:none!important;box-shadow:none!important;font-weight:700;font-size:11px;color:#fff;text-shadow:0 0 3px #000,0 0 6px #000;padding:0!important;white-space:nowrap}
#landing{position:fixed;inset:0;z-index:24;background:var(--bg);overflow:auto;display:none;padding:18px clamp(16px,4vw,48px) 0}
#landing.on{display:block}
.lp-nav{display:flex;align-items:center;gap:10px;padding:6px 0 18px;flex-wrap:wrap}
.lp-hero{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:start;padding:20px 0 40px}
@media(max-width:920px){.lp-hero{grid-template-columns:1fr}}
.lp-h1{font-family:'Sora',sans-serif;font-size:clamp(1.6rem,3.4vw,2.5rem);line-height:1.15;margin:14px 0 12px;letter-spacing:-.02em}
.lp-grad{background:linear-gradient(90deg,#1668e3,#7a6ff0);-webkit-background-clip:text;background-clip:text;color:transparent}
.lp-stats{display:flex;gap:28px;margin-top:26px;flex-wrap:wrap}
.lp-stats div{display:flex;flex-direction:column}
.lp-stats b{font-family:'Sora',sans-serif;font-size:1.5rem;font-weight:800}
.lp-stats span{color:var(--mut);font-size:.78rem}
.lp-pop{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;cursor:pointer;box-shadow:0 3px 10px rgba(13,27,46,.08)}
.lp-pop:hover{border-color:var(--ac)}
.lp-steps-wrap{padding:30px 0 10px}
.lp-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-top:18px}
.lp-step{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px}
.lp-step span.mut:first-child{font-weight:800;color:var(--ac)}
.jt{position:relative;margin-left:6px;padding-left:20px;border-left:2px dashed var(--ln)}
.jt .jts{position:relative;padding:8px 0}
.jt .jts::before{content:"";position:absolute;left:-27px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--ac);border:2px solid var(--pn)}
.kline{stroke-dasharray:1400;stroke-dashoffset:1400;animation:tndash 1.1s ease forwards}
@keyframes tndash{to{stroke-dashoffset:0}}
.vbr,.hbr{cursor:pointer}
.vbr:hover{opacity:.8}
.hbr:hover .bar i{filter:brightness(1.15)}
#auth{display:none}

/* ---- Vehicle journey generator (deterministic per plate) ---- */
function seedRand(seed){let h=0;for(let i=0;i<String(seed).length;i++){h=(h*31+String(seed).charCodeAt(i))>>>0}return function(){h=(h*1664525+1013904223)>>>0;return h/4294967296}}
function buildJourney(plate){
  const rnd=seedRand(plate),ids=Object.keys(N);
  const hops=3+Math.floor(rnd()*3);
  let curId=ids[Math.floor(rnd()*ids.length)];
  const path=[curId],edges=[];
  for(let i=0;i<hops;i++){
    const opts=E.map((e,idx)=>({e,idx})).filter(o=>o.e.a==curId||o.e.b==curId);
    if(!opts.length)break;
    const pick=opts[Math.floor(rnd()*opts.length)];
    const nxt=pick.e.a==curId?pick.e.b:pick.e.a;
    edges.push(pick.idx);curId=nxt;path.push(curId);
  }
  const totalKm=edges.reduce((s,i)=>s+E[i].d,0),totalMin=edges.reduce((s,i)=>s+E[i].d/spd(E[i])*60,0);
  let t=Date.now()-totalMin*60000-rnd()*600000;
  const stops=path.map((id,i)=>{if(i>0)t+=E[edges[i-1]].d/spd(E[edges[i-1]])*60*60000;return{id,name:N[id][0],cam:N[id][3],time:new Date(t).toLocaleTimeString('en-IN',{hour12:false})}});
  const legs=edges.map((idx,i)=>({road:E[idx].n,km:E[idx].d,mn:E[idx].d/spd(E[idx])*60,kmh:spd(E[idx])}));
  return{plate,stops,legs,totalKm,totalMin,from:N[path[0]][0],to:N[path[path.length-1]][0],path,edges};
